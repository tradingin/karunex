<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karunex Co. - Checkout</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://khalti.com/static/khalti-checkout.js"></script>
</head>
<body>
    <div class="container">
        <h2>Checkout</h2>
        <form id="checkoutForm">
            <input type="text" id="name" placeholder="Your Name" required>
            <input type="email" id="email" placeholder="Your Email" required>
            <input type="tel" id="phone" placeholder="Your Phone" required>
            <textarea id="address" placeholder="Shipping Address" rows="4" required></textarea>

            <h3>Order Summary</h3>
            <div id="orderSummary"></div>
            <h3>Total: NPR <span id="totalAmount">0</span></h3>

            <h3>Payment Options</h3>
            <div class="payment-options">
                <button type="button" id="khalti-button">Pay with Khalti</button>
                <button type="button" id="esewa-button">Pay with eSewa</button>
                <button type="button" id="cod-button">Cash on Delivery</button>
            </div>
        </form>
    </div>

    <script src="checkout.js"></script>
</body>
</html>
