<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Khalti Checkout Example</title>
  <script src="https://khalti.com/static/khalti-checkout.js"></script>
</head>
<body>
  <button id="buy">Pay with Khalti</button>

  <script>
    const khaltiConfig = {
      // Replace with your Khalti public key
      publicKey: 'test_public_key_xxxxxxx',
      productIdentity: 'order-123',
      productName: 'Karunex Order #123',
      productUrl: window.location.href,
      eventHandler: {
        onSuccess(payload) {
          // payload.token is used for server verification
          // Send token and amount (in paisa) to server endpoint
          fetch('/api/payments/khalti/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: payload.token, amount: 1000 }) // example: NPR 10.00 -> 1000
          }).then(r => r.json()).then(data => {
            console.log('Server verification response', data);
            if (data.ok) {
              alert('Payment verified on server.');
            } else {
              alert('Verification failed: ' + JSON.stringify(data));
            }
          }).catch(err => {
            console.error(err);
            alert('Verification error. Check console.');
          });
        },
        onError(err) {
          console.error('Khalti checkout error', err);
        },
        onClose() {
          console.log('Khalti widget is closing');
        }
      }
    };

    const checkout = new KhaltiCheckout(khaltiConfig);
    document.getElementById('buy').addEventListener('click', function () {
      // amount in paisa
      checkout.show({ amount: 1000 });
    });
  </script>
</body>
</html>
