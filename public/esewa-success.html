<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>eSewa Return Handler</title>
</head>
<body>
  <h1>Processing eSewa response...</h1>
  <pre id="out"></pre>
  <script>
    // eSewa typically redirects to your success URL with query params like pid, amt, refId
    const qs = new URLSearchParams(window.location.search);
    const pid = qs.get('pid') || qs.get('oid');
    const amt = qs.get('amt');

    document.getElementById('out').textContent = `pid: ${pid}\namt: ${amt}\nSending to server for verification...`;

    if (!pid || !amt) {
      document.getElementById('out').textContent += '\nMissing pid or amt in query params.';
    } else {
      fetch('/api/payments/esewa/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pid, amt })
      }).then(r => r.json()).then(data => {
        document.getElementById('out').textContent += '\nServer response:\n' + JSON.stringify(data, null, 2);
      }).catch(err => {
        document.getElementById('out').textContent += '\nError: ' + err;
      });
    }
  </script>
</body>
</html>
